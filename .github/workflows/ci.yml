name: cli

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happy-wakey-cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: Verify Zed package contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output /tmp/zed.tar.gz \
            https://github.com/zed-pkg/zed-cli/releases/download/v0.2.3/zed-x86_64-unknown-linux-gnu.tar.gz
          echo 'b8f81a8e4943cbaeb47153386819a911dcf02666a8709c5bd013e4f35b1ba1b9  /tmp/zed.tar.gz' | sha256sum --check
          tar -xzf /tmp/zed.tar.gz -C /tmp
          /tmp/zed validate
      - run: cargo fmt --all -- --check
      - name: Run native gates when the private Shared Auth source is available
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          if git ls-remote https://github.com/shared-auth/shared-auth-clients.git HEAD >/dev/null 2>&1; then
            cargo test --all-targets --locked
            cargo clippy --all-targets --locked -- -D warnings
          else
            echo '::warning::Native gates require approved cross-organization read access to shared-auth/shared-auth-clients.'
          fi
