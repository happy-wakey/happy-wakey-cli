[identity]
service = "happy-wakey-cli"
type_name = "CliEnv"

[help]
url = "https://github.com/happy-wakey/happy-wakey-cli"

[parse]
command_env = "HAPPY_WAKEY_COMMAND"
allow_unknown = false
unknown_options_env = "HAPPY_WAKEY_UNKNOWN_OPTIONS"
errors_env = "HAPPY_WAKEY_FLAG_ERRORS"

[env]
ignore = ["FLAGS2ENV_CONFIG", "HAPPY_WAKEY_ACCESS_TOKEN"]

[flags.shared_auth_base]
env = "HAPPY_WAKEY_SHARED_AUTH_BASE"
aliases = ["shared-auth-base"]
type = "string"
default = "https://auth.oresoftware.dev"

[flags.api_base]
env = "HAPPY_WAKEY_API_BASE"
aliases = ["api-base"]
type = "string"
default = "https://api.happy-wakey.dev"

[flags.pretty]
env = "HAPPY_WAKEY_PRETTY"
aliases = ["pretty"]
type = "bool"
default = false

[commands.capabilities]
help = "Report the non-secret Shared Auth capability surface."

[commands.verify]
help = "Verify HAPPY_WAKEY_ACCESS_TOKEN without printing it."

[commands.alarms]
help = "Read and create alarms through the JSON API."

[commands.alarms.commands.list]
help = "List alarms owned by the authenticated subject."

[commands.alarms.commands.create]
help = "Create an alarm with an idempotent transition ID."

[commands.alarms.commands.create.flags.transition_id]
env = "HAPPY_WAKEY_TRANSITION_ID"
aliases = ["transition-id"]
type = "string"

[commands.alarms.commands.create.flags.label]
env = "HAPPY_WAKEY_ALARM_LABEL"
aliases = ["label"]
type = "string"

[commands.alarms.commands.create.flags.local_time]
env = "HAPPY_WAKEY_ALARM_LOCAL_TIME"
aliases = ["local-time"]
type = "string"

[commands.alarms.commands.create.flags.time_zone]
env = "HAPPY_WAKEY_ALARM_TIME_ZONE"
aliases = ["time-zone"]
type = "string"

[commands.alarms.commands.create.flags.weekdays]
env = "HAPPY_WAKEY_ALARM_WEEKDAYS"
aliases = ["weekdays"]
type = "array"

[commands.alarms.commands.create.flags.enabled]
env = "HAPPY_WAKEY_ALARM_ENABLED"
aliases = ["enabled"]
type = "bool"
default = true

[commands.alarms.commands.create.flags.sound]
env = "HAPPY_WAKEY_ALARM_SOUND"
aliases = ["sound"]
type = "string"
default = "bell"

[commands.alarms.commands.create.flags.volume]
env = "HAPPY_WAKEY_ALARM_VOLUME"
aliases = ["volume"]
type = "double"
default = 0.8

[commands.alarms.commands.create.flags.gradual_seconds]
env = "HAPPY_WAKEY_ALARM_GRADUAL_SECONDS"
aliases = ["gradual-seconds"]
type = "integer"
default = 30

[commands.alarms.commands.create.flags.tags]
env = "HAPPY_WAKEY_ALARM_TAGS"
aliases = ["tags"]
type = "array"
default = []

[commands.occurrences]
help = "Apply generation-fenced occurrence transitions."

[commands.occurrences.commands.transition]
help = "Apply one idempotent occurrence transition."

[commands.occurrences.commands.transition.flags.occurrence_id]
env = "HAPPY_WAKEY_OCCURRENCE_ID"
aliases = ["occurrence-id"]
type = "string"

[commands.occurrences.commands.transition.flags.transition_id]
env = "HAPPY_WAKEY_TRANSITION_ID"
aliases = ["transition-id"]
type = "string"

[commands.occurrences.commands.transition.flags.expected_generation]
env = "HAPPY_WAKEY_EXPECTED_GENERATION"
aliases = ["expected-generation"]
type = "integer"

[commands.occurrences.commands.transition.flags.event]
env = "HAPPY_WAKEY_TRANSITION_EVENT"
aliases = ["event"]
type = "string"

[commands.occurrences.commands.transition.flags.snooze_until]
env = "HAPPY_WAKEY_SNOOZE_UNTIL"
aliases = ["snooze-until"]
type = "string"

[commands.occurrences.commands.transition.flags.client_time]
env = "HAPPY_WAKEY_CLIENT_TIME"
aliases = ["client-time"]
type = "string"


[flags.flags2env-config]
env = "FLAGS2ENV_CONFIG"
long = "flags2env-config"
type = "string"
help = "Runtime environment key FLAGS2ENV_CONFIG."

[flags.happy-wakey-access-token]
env = "HAPPY_WAKEY_ACCESS_TOKEN"
long = "happy-wakey-access-token"
type = "string"
help = "Runtime environment key HAPPY_WAKEY_ACCESS_TOKEN."
